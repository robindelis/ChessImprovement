<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="knightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle Accent Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- Chess Knight Icon centered and scaled -->
  <g transform="translate(96, 96) scale(7.11)">
    <g fill="none" fill-rule="evenodd" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
      <!-- Knight Body and Neck -->
      <path fill="url(#knightGrad)" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <!-- Knight Head and Mane -->
      <path fill="url(#knightGrad)" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <!-- Eye and Nostril -->
      <circle cx="9" cy="25.5" r="1" fill="#0f172a"/>
      <ellipse cx="14.5" cy="16" rx="1.5" ry="0.8" fill="#0f172a" transform="rotate(-30 14.5 16)"/>
    </g>
  </g>
</svg>
